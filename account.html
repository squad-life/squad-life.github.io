<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Профиль — Life Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        :root { --bg: #0c0c0e; --surface: #141416; --surface-elevated: #1c1c20; --accent: #7c4dff; --text: #fff; --text-secondary: #a0a0b0; --border: rgba(255,255,255,0.06); }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, Inter, system-ui, sans-serif; padding: 0 16px 90px 16px; line-height: 1.4; }
        .container { max-width: 540px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 12px 0 20px 0; position: sticky; top: 0; background: var(--bg); z-index: 10; }
        .logo img { height: 48px; width: auto; }
        .user-avatar { width: 42px; height: 42px; border-radius: 50%; background: rgba(20,20,30,0.6); backdrop-filter: blur(8px); border: 1px solid rgba(124,77,255,0.4); overflow: hidden; cursor: pointer; }
        .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .profile-card { background: linear-gradient(135deg, #1a1a2e, #0f0f1a); border-radius: 32px; padding: 24px; text-align: center; margin-bottom: 24px; }
        .profile-avatar { width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 12px; border: 2px solid var(--accent); overflow: hidden; }
        .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .profile-name { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
        .profile-balance { font-size: 36px; font-weight: 800; color: var(--accent); margin-bottom: 4px; }
        .balance-label { font-size: 14px; color: var(--text-secondary); }
        .menu-item { background: var(--surface); border-radius: 20px; padding: 16px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; border: 1px solid var(--border); }
        .menu-item:active { transform: scale(0.97); background: var(--surface-elevated); }
        .menu-left { display: flex; align-items: center; gap: 14px; }
        .menu-icon { width: 32px; text-align: center; font-size: 20px; color: var(--accent); }
        .menu-text { font-weight: 500; }
        .menu-arrow { color: var(--text-secondary); }
        .bottom-nav { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); width: calc(100% - 32px); max-width: 500px; background: rgba(12,12,18,0.65); backdrop-filter: blur(28px); border-radius: 60px; display: flex; justify-content: space-around; padding: 6px 12px; border: 1px solid rgba(255,255,255,0.12); z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #8e8e9e; font-size: 11px; font-weight: 500; gap: 4px; padding: 8px 16px; border-radius: 50px; }
        .nav-item.active { color: #7c4dff; background: rgba(124,77,255,0.18); }
        .nav-icon { font-size: 22px; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <div class="logo"><img src="https://raw.githubusercontent.com/squad-life/squad-life.github.io/main/assets/logo.png" alt="Life Shop"></div>
        <div class="user-avatar" id="user-avatar"><img id="avatar-img" src="" alt="avatar"></div>
    </header>

    <div class="profile-card">
        <div class="profile-avatar"><img id="profile-avatar" src="" alt="avatar"></div>
        <div class="profile-name" id="profile-name">Пользователь</div>
        <div class="profile-balance" id="balance">0 ₽</div>
        <div class="balance-label">Баланс</div>
    </div>

    <div class="menu-item" id="promoBtn">
        <div class="menu-left"><div class="menu-icon"><i class="fas fa-ticket-alt"></i></div><div class="menu-text">Ввести промокод</div></div>
        <div class="menu-arrow"><i class="fas fa-chevron-right"></i></div>
    </div>
    <div class="menu-item" id="historyBtn">
        <div class="menu-left"><div class="menu-icon"><i class="fas fa-history"></i></div><div class="menu-text">История покупок</div></div>
        <div class="menu-arrow"><i class="fas fa-chevron-right"></i></div>
    </div>
    <div class="menu-item" id="refBtn">
        <div class="menu-left"><div class="menu-icon"><i class="fas fa-user-friends"></i></div><div class="menu-text">Реферальная система</div></div>
        <div class="menu-arrow"><i class="fas fa-chevron-right"></i></div>
    </div>
    <div class="menu-item" onclick="window.open('https://t.me/akchotzivi', '_blank')">
        <div class="menu-left"><div class="menu-icon"><i class="fas fa-star"></i></div><div class="menu-text">Отзывы</div></div>
        <div class="menu-arrow"><i class="fas fa-chevron-right"></i></div>
    </div>
    <div class="menu-item" onclick="window.open('https://telegra.ph/Pered-tem-kak-nachat-ispolzovat-nashi-uslugi-oznakomsya-s-nashimi-pravilami-06-01', '_blank')">
        <div class="menu-left"><div class="menu-icon"><i class="fas fa-file-alt"></i></div><div class="menu-text">Пользовательское соглашение</div></div>
        <div class="menu-arrow"><i class="fas fa-chevron-right"></i></div>
    </div>
    <div class="menu-item" onclick="window.open('https://t.me/Bahrik228', '_blank')">
        <div class="menu-left"><div class="menu-icon"><i class="fas fa-headset"></i></div><div class="menu-text">Поддержка</div></div>
        <div class="menu-arrow"><i class="fas fa-chevron-right"></i></div>
    </div>
</div>

<div class="bottom-nav">
    <a href="index.html" class="nav-item"><div class="nav-icon"><i class="fas fa-home"></i></div><span>Главная</span></a>
    <a href="games.html" class="nav-item"><div class="nav-icon"><i class="fas fa-gamepad"></i></div><span>Игры</span></a>
    <a href="account.html" class="nav-item active"><div class="nav-icon"><i class="fas fa-user"></i></div><span>Профиль</span></a>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.enableClosingConfirmation();
    tg.setHeaderColor('#0c0c0e');
    
    const user = tg.initDataUnsafe.user;
    const userName = user?.first_name ? `${user.first_name} ${user.last_name || ''}`.trim() : (user?.username || 'Пользователь');
    const userPhoto = user?.photo_url || 'https://cdn-icons-png.flaticon.com/512/847/847969.png';
    
    document.getElementById('profile-name').textContent = userName;
    document.getElementById('profile-avatar').src = userPhoto;
    document.getElementById('avatar-img').src = userPhoto;
    
    let balance = localStorage.getItem('userBalance');
    if (balance === null) balance = 0;
    else balance = parseInt(balance);
    document.getElementById('balance').textContent = `${balance} ₽`;
    document.getElementById('user-avatar').onclick = () => location.reload();
    
    document.getElementById('promoBtn').onclick = () => {
        const code = prompt('Введите промокод');
        if (code) alert('Промокод недействителен');
    };
    document.getElementById('historyBtn').onclick = () => alert('История покупок скоро появится');
    document.getElementById('refBtn').onclick = () => alert('Реферальная система скоро будет доступна');
</script>
</body>
</html>
