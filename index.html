<!DOCTYPE html>
<html lang="ru">
<head>
    <title>Life Shop — главная</title>
    <script src="components/head.html"></script>
</head>
<body>
<div class="container">
    <header>
        <div class="logo">
            <img src="https://raw.githubusercontent.com/squad-life/squad-life.github.io/main/assets/logo.png" alt="Life Shop" onerror="this.src='https://placehold.co/200x60/141416/7c4dff?text=Life+Shop'">
        </div>
        <div class="user-avatar" id="user-avatar">
            <img id="avatar-img" src="" alt="avatar">
        </div>
    </header>

    <!-- Моко тизер -->
    <div class="moko-teaser fade-in" id="mokoTeaser">
        <div class="moko-teaser-img">
            <img src="https://raw.githubusercontent.com/SquadBustersLife/SquadBustersLife.github.io/refs/heads/main/assets/moco_Luna_tough_shades_1052x1378.png" alt="Moko">
        </div>
        <div class="moko-teaser-text">
            <span>Охотник</span>, портал открыт! Улучши свой аутфит перед сражением с монстрами!
        </div>
        <i class="fas fa-arrow-right"></i>
    </div>

    <!-- Игры -->
    <div class="section">
        <div class="section-header">
            <h2 class="section-title">Игры</h2>
            <a href="games.html" class="section-link">Все <i class="fas fa-arrow-right"></i></a>
        </div>
        <div class="games-scroll" id="gamesContainer"></div>
    </div>

    <!-- Скидки -->
    <div class="section" id="discountSection" style="display: none;">
        <div class="section-header"><h2 class="section-title">Скидки</h2></div>
        <div class="products-scroll" id="discountContainer"></div>
    </div>

    <!-- Популярное (временно скрыто, пока нет популярных ID) -->
    <div class="section" id="popularSection" style="display: none;">
        <div class="section-header"><h2 class="section-title">Популярное</h2></div>
        <div class="products-scroll" id="popularContainer"></div>
    </div>

    <!-- Новинки -->
    <div class="section" id="newSection" style="display: none;">
        <div class="section-header"><h2 class="section-title">Новинки</h2></div>
        <div class="products-scroll" id="newContainer"></div>
    </div>

    <!-- Отзывы -->
    <div class="reviews-card">
        <i class="fas fa-message"></i>
        <p class="reviews-text">Честные отзывы игроков, Telegram-канал</p>
        <button class="reviews-btn" id="reviewsBtn"><i class="fab fa-telegram"></i> Читать</button>
    </div>
</div>

<script src="components/nav-bar.html"></script>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.enableClosingConfirmation();
    tg.setHeaderColor('#0c0c0e');
    tg.setBackgroundColor('#0c0c0e');

    // Аватар пользователя
    const user = tg.initDataUnsafe.user;
    const avatarImg = document.getElementById('avatar-img');
    if (user?.photo_url) avatarImg.src = user.photo_url;
    else avatarImg.src = 'https://cdn-icons-png.flaticon.com/512/847/847969.png';
    
    document.getElementById('user-avatar').onclick = () => location.href = 'account.html';
    document.getElementById('mokoTeaser').onclick = () => location.href = 'game.html?game=Moko';
    document.getElementById('reviewsBtn').onclick = () => window.open('https://t.me/akchotzivi', '_blank');

    const DATA_BASE = 'https://raw.githubusercontent.com/squad-life/squad-life.github.io/main/data/';
    let allOffers = [];
    let gamesList = [];
    let collections = { popular: [], discount: [], new: [] };

    async function loadData() {
        try {
            const [offersRes, gamesRes, collectionsRes] = await Promise.all([
                fetch(`${DATA_BASE}all_offers.json`),
                fetch(`${DATA_BASE}games.json`),
                fetch(`${DATA_BASE}collections.json`)
            ]);
            if (offersRes.ok) allOffers = (await offersRes.json()).offers || [];
            if (gamesRes.ok) gamesList = await gamesRes.json();
            if (collectionsRes.ok) collections = await collectionsRes.json();
            
            console.log('Загружено товаров:', allOffers.length);
            console.log('Коллекции:', collections);
            
            renderGames();
            renderCollections();
        } catch(e) { console.error('Ошибка загрузки:', e); renderGamesFallback(); }
    }

    function renderGames() {
        const container = document.getElementById('gamesContainer');
        if (!gamesList.length) { container.innerHTML = '<div style="color:#888;">Игры не загружены</div>'; return; }
        container.innerHTML = '';
        gamesList.slice(0, 8).forEach((game, idx) => {
            const card = document.createElement('div');
            card.className = `game-card fade-in delay-${(idx % 4) + 1}`;
            card.onclick = () => location.href = `game.html?game=${encodeURIComponent(game.name)}`;
            card.innerHTML = `<div class="game-icon"><img src="${game.logo}" alt="${game.name}" onerror="this.src='https://placehold.co/86x86/1c1c20/7c4dff?text=${game.name.charAt(0)}'"></div><div class="game-name">${game.name}</div>`;
            container.appendChild(card);
        });
    }

    function renderGamesFallback() {
        const fallback = [{ name: 'Brawl Stars', logo: 'https://placehold.co/86x86/1c1c20/7c4dff?text=BS' }];
        const container = document.getElementById('gamesContainer');
        container.innerHTML = '';
        fallback.forEach((game, idx) => {
            const card = document.createElement('div');
            card.className = `game-card fade-in delay-${idx+1}`;
            card.onclick = () => location.href = `game.html?game=${game.name}`;
            card.innerHTML = `<div class="game-icon"><img src="${game.logo}" alt="${game.name}"></div><div class="game-name">${game.name}</div>`;
            container.appendChild(card);
        });
    }

    function renderCollections() {
        // Скидки
        if (collections.discount?.length) {
            const products = collections.discount.map(id => allOffers.find(o => o.id === id)).filter(Boolean);
            if (products.length) {
                document.getElementById('discountSection').style.display = 'block';
                renderProductList(products, 'discountContainer');
            }
        }
        // Новинки
        if (collections.new?.length) {
            const products = collections.new.map(id => allOffers.find(o => o.id === id)).filter(Boolean);
            if (products.length) {
                document.getElementById('newSection').style.display = 'block';
                renderProductList(products, 'newContainer');
            }
        }
        // Если популярных нет — показываем первые 6 товаров из каталога
        const popularProducts = collections.popular?.length 
            ? collections.popular.map(id => allOffers.find(o => o.id === id)).filter(Boolean)
            : allOffers.slice(0, 6);
        if (popularProducts.length) {
            document.getElementById('popularSection').style.display = 'block';
            renderProductList(popularProducts, 'popularContainer');
        }
    }

    function renderProductList(products, containerId) {
        const container = document.getElementById(containerId);
        if (!products.length) { container.innerHTML = '<div style="color:#888;">Нет товаров</div>'; return; }
        container.innerHTML = '';
        products.forEach((product, idx) => {
            const price = product.variants?.length ? product.variants[0].price : (product.price || 0);
            const hasDiscount = product.discount > 0;
            let finalPrice = hasDiscount ? Math.round(price * (1 - product.discount / 100)) : price;
            let priceHtml = hasDiscount 
                ? `<div class="price-row"><div class="product-price">${finalPrice} ₽</div><div class="old-price">${price} ₽</div></div>`
                : `<div class="product-price">${price} ₽</div>`;
            
            const card = document.createElement('div');
            card.className = `product-card fade-in delay-${(idx % 4) + 1}`;
            card.onclick = () => location.href = `offer.html?id=${product.id}`;
            card.innerHTML = `
                <div class="product-banner" id="banner-${product.id}">
                    <img src="${product.banner1}" class="active" alt="">
                    <img src="${product.banner2}" alt="">
                </div>
                <div class="product-info">
                    <div class="product-name">${escapeHtml(product.name)}</div>
                    ${priceHtml}
                    ${hasDiscount ? `<div class="discount-badge">-${product.discount}%</div>` : ''}
                </div>
            `;
            container.appendChild(card);
            startBannerRotation(product.id);
        });
    }

    function startBannerRotation(id) {
        const bannerDiv = document.getElementById(`banner-${id}`);
        if (!bannerDiv) return;
        const imgs = bannerDiv.querySelectorAll('img');
        if (imgs.length < 2) return;
        let current = 0;
        setInterval(() => {
            imgs[current].classList.remove('active');
            current = (current + 1) % imgs.length;
            imgs[current].classList.add('active');
        }, 5000);
    }

    function escapeHtml(str) { return str?.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])) || ''; }

    loadData();
</script>
</body>
</html>
